name: Build APK

on:
  push:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest sudah menyediakan Android SDK (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DuniaPuzzle-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DuniaPuzzle-apk
          path: DuniaPuzzle-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Dunia Puzzle v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: DuniaPuzzle-*.apk
          body: |
            📱 **Dunia Puzzle** — 33 game puzzle dalam satu aplikasi.

            Cara install: unduh file `.apk` di bawah dari HP Android, buka, lalu izinkan "Install dari sumber tidak dikenal" jika diminta.
